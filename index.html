<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES Mobil Süper Lig - Canlı</title>
    <!-- Supabase Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --ana-renk: #000; --ikincil: #fff; --gri: #1a1a1a; --kart-bg: #262626; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--ana-renk); color: var(--ikincil); margin: 0; padding: 15px; }
        .container { max-width: 700px; margin: auto; background: var(--gri); padding: 20px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        h2, h3 { text-align: center; border-bottom: 2px solid #fff; padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .card { background: var(--kart-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        input, select, button { padding: 10px; border-radius: 5px; border: none; font-size: 14px; margin: 5px 0; }
        input { background: #333; color: #fff; width: calc(100% - 22px); }
        button { background: #fff; color: #000; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: #ccc; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th { background: #111; padding: 10px; border: 1px solid #444; }
        td { padding: 10px; text-align: center; border: 1px solid #444; }
        tr:nth-child(1) { background: #222; font-weight: bold; color: #f1c40f; }

        .mac-satir { display: flex; justify-content: space-between; align-items: center; background: #1f1f1f; padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #fff; }
        .mac-satir input { width: 50px; text-align: center; margin: 0 5px; }
        .hafta-baslik { color: #f1c40f; margin-top: 15px; font-weight: bold; font-size: 16px; border-bottom: 1px dashed #444; padding-bottom: 5px; }
        #yukleniyor { text-align: center; color: #f1c40f; font-weight: bold; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🦅 PES Süper Lig Canlı Panel</h2>
    <div id="yukleniyor">Veriler Buluttan Yükleniyor...</div>

    <!-- Yönetim / Takım Ekleme Paneli -->
    <div class="card">
        <h3>1. Takımları Ekle</h3>
        <input type="text" id="takimAdi" placeholder="Takım / Oyuncu İsmi (Örn: Beşiktaş)">
        <button onclick="takimEkle()">Takımı Listeye Ekle</button>
        <p id="takimListesi" style="font-size: 13px; color: #aaa; margin-top: 10px;"></p>
        <button onclick="fiksturOlustur()" style="background: #27ae60; color: #fff; margin-top: 10px;">🎲 Fikstür Oluştur & Veritabanına Kaydet</button>
    </div>

    <!-- Fikstür ve Skor Girişi -->
    <div class="card" id="fiksturBolumu" style="display:none;">
        <h3>🗓️ Lig Fikstürü ve Maçlar</h3>
        <div id="fiksturAlani"></div>
    </div>

    <!-- Puan Durumu -->
    <div class="card">
        <h3>📊 Puan Durumu</h3>
        <table id="puanTablosu">
            <thead>
                <tr>
                    <th>Sıra</th>
                    <th>Takım</th>
                    <th>O</th>
                    <th>G</th>
                    <th>B</th>
                    <th>M</th>
                    <th>AV</th>
                    <th>P</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="8" style="color:#777;">Veriler bekleniyor...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- SUPABASE BAĞLANTI AYARLARI ---
    // Kendi Supabase Proje URL ve Anon Key bilgilerini buraya yapıştıracaksın:
    const SUPABASE_URL = 'https://nizomeoetxkefaoelycb.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_FlareC8OwpaT6NI51MP_Jw_S6aVPuPV';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let takimlar = [];
    let fikstur = [];
    let puanlar = {};

    // Sayfa açıldığında Supabase'den verileri çek
    async5_init = window.onload = async () => {
        document.getElementById('yukleniyor').style.display = 'block';
        try {
            let { data, error } = await _supabase
                .from('lig_verileri')
                .select('*')
                .eq('id', 1)
                .single();

            if (data) {
                takimlar = data.takimlar || [];
                fikstur = data.fikstur || [];
                puanlar = data.puanlar || {};
                
                if(takimlar.length > 0) {
                    document.getElementById('takimListesi').innerHTML = "Eklenen Takımlar: " + takimlar.join(', ');
                    document.getElementById('fiksturBolumu').style.display = 'block';
                    fiksturCiz();
                    puanTablosuGuncelle();
                }
            }
        } catch(err) {
            console.log("Henüz veri yok veya bağlantı hatası:", err);
        }
        document.getElementById('yukleniyor').style.display = 'none';
    };

    // Verileri Supabase'e Kaydetme Fonksiyonu
    async function verileriBulutaKaydet() {
        document.getElementById('yukleniyor').innerText = "Kaydediliyor...";
        document.getElementById('yukleniyor').style.display = 'block';

        const { data, error } = await _supabase
            .from('lig_verileri')
            .upsert({ id: 1, takimlar: takimlar, fikstur: fikstur, puanlar: puanlar });

        if (error) {
            alert("Kaydetme hatası: " + error.message);
        }
        document.getElementById('yukleniyor').style.display = 'none';
    }

    function takimEkle() {
        const input = document.getElementById('takimAdi');
        const isim = input.value.trim();
        if(!isim) return alert("Boş takım ismi olamaz!");
        if(takimlar.includes(isim)) return alert("Bu takım zaten ekli!");
        
        takimlar.push(isim);
        input.value = "";
        document.getElementById('takimListesi').innerHTML = "Eklenen Takımlar: " + takimlar.join(', ');
        verileriBulutaKaydet();
    }

    function fiksturOlustur() {
        if(takimlar.length < 2) return alert("En az 2 takım eklemelisin!");
        
        let t = [...takimlar];
        if (t.length % 2 !== 0) t.push("BAY");
        
        const n = t.length;
        let haftalar = [];
        
        for (let i = 0; i < n - 1; i++) {
            let haftaMaçları = [];
            for (let j = 0; j < n / 2; j++) {
                let ev = t[j];
                let dep = t[n - 1 - j];
                if (ev !== "BAY" && dep !== "BAY") {
                    haftaMaçları.push({ev: ev, dep: dep, s1: "", s2: ""});
                }
            }
            haftalar.push(haftaMaçları);
            t.splice(1, 0, t.pop());
        }

        let ikinciYari = haftalar.map(hafta => 
            hafta.map(mac => ({ev: mac.dep, dep: mac.ev, s1: "", s2: ""}))
        );
        fikstur = haftalar.concat(ikinciYari);

        puanlar = {};
        takimlar.forEach(tk => {
            puanlar[tk] = {o:0, g:0, b:0, m:0, ag:0, yg:0, p:0};
        });

        document.getElementById('fiksturBolumu').style.display = 'block';
        fiksturCiz();
        puanTablosuGuncelle();
        verileriBulutaKaydet();
        alert("Fikstür oluşturuldu ve buluta kaydedildi!");
    }

    function fiksturCiz() {
        const alan = document.getElementById('fiksturAlani');
        alan.innerHTML = "";

        fikstur.forEach((hafta, hIndex) => {
            let html = `<div class="hafta-baslik">${hIndex + 1}. Hafta</div>`;
            hafta.forEach((mac, mIndex) => {
                html += `
                    <div class="mac-satir">
                        <span style="flex:1; text-align:right; padding-right:10px;">${mac.ev}</span>
                        <input type="number" id="h${hIndex}_m${mIndex}_s1" value="${mac.s1}" onchange="skorGuncelle(${hIndex}, ${mIndex})">
                        <span>-</span>
                        <input type="number" id="h${hIndex}_m${mIndex}_s2" value="${mac.s2}" onchange="skorGuncelle(${hIndex}, ${mIndex})">
                        <span style="flex:1; text-align:left; padding-left:10px;">${mac.dep}</span>
                    </div>`;
            });
            alan.innerHTML += html;
        });
    }

    function skorGuncelle(hIndex, mIndex) {
        const s1Val = document.getElementById(`h${hIndex}_m${mIndex}_s1`).value;
        const s2Val = document.getElementById(`h${hIndex}_m${mIndex}_s2`).value;

        fikstur[hIndex][mIndex].s1 = s1Val;
        fikstur[hIndex][mIndex].s2 = s2Val;

        puanlariHesaplaVeYenile();
        verileriBulutaKaydet();
    }

    function puanlariHesaplaVeYenile() {
        puanlar = {};
        takimlar.forEach(tk => {
            puanlar[tk] = {o:0, g:0, b:0, m:0, ag:0, yg:0, p:0};
        });

        fikstur.forEach(hafta => {
            hafta.forEach(mac => {
                if(mac.s1 !== "" && mac.s2 !== "") {
                    let s1 = parseInt(mac.s1);
                    let s2 = parseInt(mac.s2);
                    let t1 = puanlar[mac.ev];
                    let t2 = puanlar[mac.dep];

                    if(t1 && t2) {
                        t1.o++; t2.o++;
                        t1.ag += s1; t1.yg += s2;
                        t2.ag += s2; t2.yg += s1;

                        if(s1 > s2) { t1.g++; t1.p += 3; t2.m++; }
                        else if(s2 > s1) { t2.g++; t2.p += 3; t1.m++; }
                        else { t1.b++; t2.b++; t1.p += 1; t2.p += 1; }
                    }
                }
            });
        });

        puanTablosuGuncelle();
    }

    function puanTablosuGuncelle() {
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = "";

        let sirali = Object.keys(puanlar).sort((a,b) => {
            if(puanlar[b].p !== puanlar[a].p) return puanlar[b].p - puanlar[a].p;
            let avB = puanlar[b].ag - puanlar[b].yg;
            let avA = puanlar[a].ag - puanlar[a].yg;
            if(avB !== avA) return avB - avA;
            return puanlar[b].ag - puanlar[a].ag;
        });

        if(sirali.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="color:#777;">Henüz takım yok.</td></tr>`;
            return;
        }

        sirali.forEach((isim, i) => {
            const t = puanlar[isim];
            tbody.innerHTML += `<tr>
                <td>${i+1}</td>
                <td style="text-align:left">${isim}</td>
                <td>${t.o}</td>
                <td>${t.g}</td>
                <td>${t.b}</td>
                <td>${t.m}</td>
                <td>${t.ag - t.yg}</td>
                <td><b>${t.p}</b></td>
            </tr>`;
        });
    }
</script>

</body>
</html>
