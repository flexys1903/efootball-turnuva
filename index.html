<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES Mobil Süper Lig</title>
    <style>
        :root { --ana-renk: #000; --ikincil: #fff; --gri: #1a1a1a; }
        body { font-family: 'Arial', sans-serif; background-color: var(--ana-renk); color: var(--ikincil); margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; background: var(--gri); padding: 15px; border-radius: 10px; border: 1px solid #333; }
        h2 { text-align: center; border-bottom: 2px solid #fff; padding-bottom: 10px; text-transform: uppercase; }
        
        /* Tablo Stili */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th { background: #333; padding: 10px; border: 1px solid #444; }
        td { padding: 10px; text-align: center; border: 1px solid #444; }
        tr:nth-child(1) { background: #222; font-weight: bold; color: #f1c40f; } /* Lider rengi */

        /* Giriş Paneli */
        .admin-panel { background: #fff; color: #000; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .admin-panel input { width: 80px; padding: 5px; margin: 5px; }
        button { background: #000; color: #fff; padding: 8px 15px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        
        .footer { text-align: center; font-size: 12px; margin-top: 20px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>🦅 PES Süper Lig</h2>

    <div class="admin-panel" id="admin">
        <h4 style="margin:0 0 10px 0">Skor Gir</h4>
        <input type="text" id="ev" placeholder="Ev Sahibi">
        <input type="number" id="s1" placeholder="0">
        -
        <input type="number" id="s2" placeholder="0">
        <input type="text" id="dep" placeholder="Deplasman">
        <br>
        <button onclick="macEkle()">Kaydet ve Güncelle</button>
    </div>

    <table id="puanTablosu">
        <thead>
            <tr>
                <th>Sıra</th>
                <th>Takım</th>
                <th>O</th>
                <th>G</th>
                <th>B</th>
                <th>M</th>
                <th>AV</th>
                <th>P</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <div class="footer">Veriler anlık olarak güncellenir.</div>
</div>

<script>
    let veriler = {};

    function macEkle() {
        const ev = document.getElementById('ev').value.trim();
        const dep = document.getElementById('dep').value.trim();
        const s1 = parseInt(document.getElementById('s1').value);
        const s2 = parseInt(document.getElementById('s2').value);

        if(!ev || !dep || isNaN(s1) || isNaN(s2)) return;

        [ev, dep].forEach(t => {
            if(!veriler[t]) veriler[t] = {o:0, g:0, b:0, m:0, ag:0, yg:0, p:0};
        });

        const t1 = veriler[ev], t2 = veriler[dep];
        t1.o++; t2.o++;
        t1.ag += s1; t1.yg += s2;
        t2.ag += s2; t2.yg += s1;

        if(s1 > s2) { t1.g++; t1.p += 3; t2.m++; }
        else if(s2 > s1) { t2.g++; t2.p += 3; t1.m++; }
        else { t1.b++; t2.b++; t1.p += 1; t2.p += 1; }

        tabloyuCiz();
        // Verileri tarayıcıya kaydeder (Sayfa kapansa da gitmez)
        localStorage.setItem('pesLigVeri', JSON.stringify(veriler));
    }

    function tabloyuCiz() {
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = "";
        
        let sirali = Object.keys(veriler).sort((a,b) => {
            if(veriler[b].p !== veriler[a].p) return veriler[b].p - veriler[a].p;
            return (veriler[b].ag - veriler[b].yg) - (veriler[a].ag - veriler[a].yg);
        });

        sirali.forEach((isim, i) => {
            const t = veriler[isim];
            tbody.innerHTML += `<tr>
                <td>${i+1}</td>
                <td style="text-align:left">${isim}</td>
                <td>${t.o}</td>
                <td>${t.g}</td>
                <td>${t.b}</td>
                <td>${t.m}</td>
                <td>${t.ag - t.yg}</td>
                <td>${t.p}</td>
            </tr>`;
        });
    }

    // Sayfa açıldığında eski verileri yükle
    window.onload = () => {
        const kayıtlı = localStorage.getItem('pesLigVeri');
        if(kayıtlı) { veriler = JSON.parse(kayıtlı); tabloyuCiz(); }
    };
</script>

</body>
</html>
