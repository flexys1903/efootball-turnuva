<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES Mobil Turnuvası</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #262626; padding: 20px; border-radius: 15px; border-top: 5px solid #f2f2f2; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #fff; text-transform: uppercase; letter-spacing: 2px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #333; border-radius: 10px; overflow: hidden; }
        th { background-color: #000; color: #fff; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #444; }
        tr:nth-child(even) { background-color: #2c2c2c; }
        .form-group { margin: 20px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        input, select, button { padding: 10px; border-radius: 5px; border: none; font-size: 16px; }
        button { background: #f2f2f2; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #ccc; }
        .winner { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🦅 PES Süper Lig</h1>
    
    <div class="form-group">
        <input type="text" id="p1" placeholder="Oyuncu 1">
        <input type="number" id="s1" placeholder="Skor" style="width: 60px;">
        <span>-</span>
        <input type="number" id="s2" placeholder="Skor" style="width: 60px;">
        <input type="text" id="p2" placeholder="Oyuncu 2">
        <button onclick="macEkle()">Maçı Kaydet</button>
    </div>

    <table id="puanTablosu">
        <thead>
            <tr>
                <th>Sıra</th>
                <th>Oyuncu</th>
                <th>O</th>
                <th>G</th>
                <th>B</th>
                <th>M</th>
                <th>Puan</th>
            </tr>
        </thead>
        <tbody id="puanBody">
            </tbody>
    </table>

    <h3>Son Karşılaşmalar</h3>
    <ul id="macListesi" style="list-style: none; padding: 0;"></ul>
</div>

<script>
    let oyuncular = {};

    function macEkle() {
        const p1 = document.getElementById('p1').value.trim();
        const p2 = document.getElementById('p2').value.trim();
        const s1 = parseInt(document.getElementById('s1').value);
        const s2 = parseInt(document.getElementById('s2').value);

        if(!p1 || !p2 || isNaN(s1) || isNaN(s2)) return alert("Eksik bilgi!");

        [p1, p2].forEach(p => {
            if(!oyuncular[p]) oyuncular[p] = {o:0, g:0, b:0, m:0, p:0};
        });

        oyuncular[p1].o++;
        oyuncular[p2].o++;

        if(s1 > s2) { oyuncular[p1].g++; oyuncular[p1].p += 3; oyuncular[p2].m++; }
        else if(s2 > s1) { oyuncular[p2].g++; oyuncular[p2].p += 3; oyuncular[p1].m++; }
        else { oyuncular[p1].b++; oyuncular[p2].b++; oyuncular[p1].p += 1; oyuncular[p2].p += 1; }

        tabloGuncelle();
        document.getElementById('macListesi').innerHTML += `<li>${p1} ${s1} - ${s2} ${p2}</li>`;
    }

    function tabloGuncelle() {
        const body = document.getElementById('puanBody');
        body.innerHTML = "";
        
        let sirali = Object.keys(oyuncular).sort((a,b) => oyuncular[b].p - oyuncular[a].p);

        sirali.forEach((isim, index) => {
            let o = oyuncular[isim];
            body.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${isim}</td>
                    <td>${o.o}</td>
                    <td>${o.g}</td>
                    <td>${o.b}</td>
                    <td>${o.m}</td>
                    <td><strong>${o.p}</strong></td>
                </tr>`;
        });
    }
</script>

</body>
</html>
