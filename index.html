<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eFootball Turnuvası - Puan Durumu & Fikstür</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --bg-deep:#0c0c0c;
  --bg-surface:#141414;
  --bg-elevated:#1f1f1f;
  --bg-elevated-2:#292929;
  --line:#333333;
  --beige:#dfcca4;
  --beige-dim:#c8b287;
  --beige-soft:rgba(223,204,164,0.12);
  --gold:#e6c594;
  --danger:#d97777;
  --danger-soft:rgba(217,119,119,0.12);
  --text:#f4f1ea;
  --text-muted:#a49e93;
  --text-faint:#6d675e;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(223,204,164,0.07), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(223,204,164,0.04), transparent 60%),
    var(--bg-deep);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px;}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-dot{width:12px;height:12px;border-radius:50%;background:var(--beige);box-shadow:0 0 10px 2px var(--beige), 0 0 24px 6px rgba(223,204,164,0.3);flex-shrink:0;}
.brand-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:22px;letter-spacing:0.5px;color:var(--text);text-transform:uppercase;}
.brand-sub{font-size:11px;color:var(--text-faint);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}

.top-actions{display:flex;gap:10px;align-items:center;}

button{font-family:'Manrope',sans-serif;cursor:pointer;border:none;outline:none;}
.btn{padding:10px 18px;border-radius:8px;font-weight:700;font-size:13.5px;letter-spacing:0.3px;transition:all .15s ease;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text-muted);}
.btn-ghost:hover{border-color:var(--beige-dim);color:var(--beige);}
.btn-cyan{background:linear-gradient(135deg,var(--beige),var(--beige-dim));color:#0c0c0c;box-shadow:0 0 18px rgba(223,204,164,0.25);}
.btn-cyan:hover{filter:brightness(1.08);}
.btn-small{padding:7px 12px;font-size:12px;border-radius:6px;}
.btn-icon{width:30px;height:30px;border-radius:6px;background:transparent;border:1px solid var(--line);color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:14px;}
.btn-icon:hover{border-color:var(--danger);color:var(--danger);}
.admin-pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:var(--beige-soft);border:1px solid rgba(223,204,164,0.35);font-size:12.5px;color:var(--beige);font-weight:700;letter-spacing:0.3px;}

.scoreboard{background:linear-gradient(180deg,var(--bg-surface),var(--bg-elevated));border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:24px;position:relative;overflow:hidden;}
.scoreboard::before{content:'';position:absolute;top:0;left:-30%;width:30%;height:2px;background:linear-gradient(90deg,transparent,var(--beige),transparent);animation:scan 3.5s linear infinite;}
@keyframes scan{ to{ left:130%; } }
.scoreboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:640px){.scoreboard-grid{grid-template-columns:1fr;}}
.sb-item{border-left:2px solid var(--line);padding-left:16px;}
.sb-item:first-child{border-left:2px solid var(--beige);}
.sb-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;}
.sb-value{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:26px;color:var(--text);line-height:1;}
.sb-value.accent{color:var(--beige);text-shadow:0 0 16px rgba(223,204,164,0.3);}
.sb-value.small{font-size:18px;}

.panel{background:var(--bg-surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:22px;}
.panel-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.5px;text-transform:uppercase;color:var(--text);margin:0 0 16px;display:flex;align-items:center;gap:10px;}
.panel-title .bar{width:4px;height:16px;background:var(--beige);border-radius:2px;box-shadow:0 0 8px var(--beige);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);}
thead th.left{text-align:left;}
tbody td{padding:11px 6px;text-align:center;border-bottom:1px solid rgba(51,51,51,0.5);font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);}
tbody td.left{text-align:left;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;}
tbody tr:hover{background:rgba(223,204,164,0.03);}
tbody tr.leader td.left{color:var(--beige);}
.rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;background:var(--bg-elevated);color:var(--text-muted);}
.rank.top{background:var(--beige-soft);color:var(--beige);box-shadow:0 0 10px rgba(223,204,164,0.2);}
.crown{margin-left:6px;color:var(--gold);text-shadow:0 0 8px rgba(230,197,148,0.6);}
.pts{font-weight:700;color:var(--beige);font-size:15px;text-shadow:0 0 10px rgba(223,204,164,0.25);}
.av-pos{color:var(--beige);}
.av-neg{color:var(--danger);}
.form-row{display:flex;gap:4px;justify-content:center;}
.form-dot{width:9px;height:9px;border-radius:50%;}
.form-dot.w{background:var(--beige);box-shadow:0 0 5px var(--beige);}
.form-dot.d{background:var(--text-faint);}
.form-dot.l{background:var(--danger);box-shadow:0 0 5px var(--danger);}
.empty-note{color:var(--text-faint);font-size:13px;padding:14px 4px;text-align:center;}

.admin-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;}
@media(max-width:760px){.admin-grid{grid-template-columns:1fr;}}

label{display:block;font-size:11.5px;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;font-weight:700;}
input,select{width:100%;background:var(--bg-elevated);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:'Manrope',sans-serif;margin-bottom:14px;}
input[type="file"]{padding:8px 10px;font-size:12.5px;color:var(--text-muted);}
input[type="file"]::file-selector-button{background:var(--bg-elevated-2);color:var(--beige);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;margin-right:10px;cursor:pointer;}
input:focus,select:focus{border-color:var(--beige-dim);outline:none;}
.score-row{display:grid;grid-template-columns:1fr 70px 20px 70px 1fr;gap:8px;align-items:start;}
.score-row select{margin-bottom:0;}
.score-row input{margin-bottom:0;text-align:center;}
.vs-label{text-align:center;color:var(--text-faint);font-family:'Rajdhani',sans-serif;font-weight:700;padding-top:10px;}

.team-badge{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.team-badge-img{border-radius:6px;object-fit:cover;background:var(--bg-elevated);flex-shrink:0;}
.team-badge-fallback{align-items:center;justify-content:center;border-radius:6px;background:var(--bg-elevated);color:var(--beige);font-family:'Rajdhani',sans-serif;font-weight:700;flex-shrink:0;}
.team-cell{display:flex;align-items:center;gap:9px;}

.team-chip{display:flex;justify-content:space-between;align-items:center;background:var(--bg-elevated);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:14px;font-weight:600;}
.team-chip .team-cell{gap:10px;}

/* Fikstür Stilleri */
.week-block{margin-bottom:20px;background:var(--bg-elevated);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.week-header{background:var(--bg-elevated-2);padding:10px 16px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:var(--beige);letter-spacing:0.8px;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.fixture-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(51,51,51,0.5);}
.fixture-row:last-child{border-bottom:none;}
.f-team{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;}
.f-team.home{justify-content:flex-end;text-align:right;}
.f-team.away{justify-content:flex-start;text-align:left;}
.f-score-box{display:flex;align-items:center;gap:6px;justify-content:center;}
.f-input{width:46px !important;margin:0 !important;padding:6px 4px !important;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}
.f-badge{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;padding:4px 12px;border-radius:6px;background:var(--beige-soft);color:var(--beige);min-width:68px;text-align:center;}
.f-badge.pending{background:var(--bg-surface);color:var(--text-faint);border:1px solid var(--line);}

.match-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(51,51,51,0.5);font-size:14px;}
.match-item .teams{font-weight:600;}
.match-item .score{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--beige);background:var(--beige-soft);padding:3px 10px;border-radius:6px;margin:0 10px;}
.match-date{font-size:11px;color:var(--text-faint);margin-right:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:linear-gradient(180deg,var(--bg-surface),var(--bg-elevated));border:1px solid var(--line);border-radius:16px;padding:28px;max-width:420px;width:100%;box-shadow:0 0 40px rgba(223,204,164,0.08);}
.modal h2{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:0.5px;margin:0 0 6px;color:var(--text);}
.modal p{font-size:13px;color:var(--text-muted);margin:0 0 20px;line-height:1.5;}
.modal-error{color:var(--danger);font-size:12.5px;margin:-8px 0 12px;min-height:16px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}

.status-banner{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;font-size:12.5px;margin-bottom:18px;}
.status-banner.saving{background:var(--beige-soft);color:var(--beige);border:1px solid rgba(223,204,164,0.3);}
.status-banner.error{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(217,119,119,0.3);}

.footnote{text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:30px;letter-spacing:0.3px;}
</style>
</head>
<body>
<div class="wrap" id="app">Yükleniyor…</div>

<script>
/* ====== GitHub Ayarları ====== */
const OWNER = 'flexys1903';
const REPO = 'efootball-turnuva';
const BRANCH = 'main';
const FILE_PATH = 'data.json';
/* ============================= */

let state = null;
let dataReady = false;
let dataMissing = false;
let adminToken = null;
let banner = null;
let currentView = 'standings'; // 'standings' veya 'fixtures'

function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function initials(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function teamBadge(team, size){
  if(!team) return '';
  const fallback = `<span class="team-badge-fallback" style="display:${team.logo?'none':'flex'};width:${size}px;height:${size}px;font-size:${Math.round(size*0.4)}px;">${esc(initials(team.name))}</span>`;
  const img = team.logo
    ? `<img class="team-badge-img" src="${esc(team.logo)}" alt="" style="width:${size}px;height:${size}px;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
    : '';
  return `<span class="team-badge">${img}${fallback}</span>`;
}

function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m,p1)=>String.fromCharCode('0x'+p1)));
}

/* ---------- GitHub'dan Veri Okuma ---------- */
async function loadData(silent){
  if(!silent) banner = null;
  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);
    
    const url = `data.json?_=${Date.now()}`;
    const res = await fetch(url, {cache:'no-store', signal: controller.signal});
    clearTimeout(timeoutId);

    if(res.status === 404){
      state = null; dataMissing = true;
    }else if(res.ok){
      state = await res.json();
      if(!state.fixtures) state.fixtures = [];
      if(!state.matches) state.matches = [];
      if(!state.teams) state.teams = [];
      dataMissing = false;
    }else{
      state = null; dataMissing = true;
    }
  }catch(e){
    console.log("Dosya bulunamadı veya henüz oluşturulmamış.");
    state = null; dataMissing = true;
  }
  dataReady = true;
  render();
}

/* ---------- GitHub'a Veri Yazma ---------- */
async function fetchCurrentSha(apiUrl){
  const getRes = await fetch(`${apiUrl}?ref=${BRANCH}&_=${Date.now()}`, {
    cache:'no-store',
    headers:{ Authorization:`Bearer ${adminToken}`, Accept:'application/vnd.github+json' }
  });
  if(getRes.status === 200){
    const j = await getRes.json();
    return j.sha;
  }else if(getRes.status === 404){
    return null;
  }else{
    throw new Error('Okuma hatası (' + getRes.status + ')');
  }
}

async function saveData(){
  if(!adminToken){ alert('Kayıt yapmak için önce yönetici girişi yapmalısın.'); return false; }
  banner = {type:'saving', text:'Kaydediliyor…'};
  render();
  const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
  try{
    let sha = await fetchCurrentSha(apiUrl);

    async function attemptPut(currentSha){
      const body = {
        message: 'Turnuva verileri güncellendi',
        content: b64EncodeUnicode(JSON.stringify(state, null, 2)),
        branch: BRANCH
      };
      if(currentSha) body.sha = currentSha;
      return fetch(apiUrl, {
        method:'PUT',
        headers:{
          Authorization:`Bearer ${adminToken}`,
          Accept:'application/vnd.github+json',
          'Content-Type':'application/json'
        },
        body: JSON.stringify(body)
      });
    }

    let putRes = await attemptPut(sha);

    if(putRes.status === 409 || putRes.status === 422){
      sha = await fetchCurrentSha(apiUrl);
      putRes = await attemptPut(sha);
    }

    if(!putRes.ok){
      const errJson = await putRes.json().catch(()=>({}));
      throw new Error((errJson.message || ('Yazma hatası ' + putRes.status)));
    }
    dataMissing = false;
    banner = null;
    render();
    return true;
  }catch(e){
    console.error(e);
    banner = {type:'error', text:'Kaydedilemedi: ' + e.message};
    render();
    return false;
  }
}

/* ---------- Puan Durumu Hesaplama ---------- */
function computeStandings(){
  const table = {};
  state.teams.forEach(t=>{ table[t.id] = {id:t.id,name:t.name,logo:t.logo||'',O:0,G:0,B:0,M:0,AG:0,YG:0,formList:[]}; });

  function processMatch(homeId, awayId, homeScore, awayScore){
    const h = table[homeId], a = table[awayId];
    if(!h || !a) return;
    h.O++; a.O++;
    h.AG += homeScore; h.YG += awayScore;
    a.AG += awayScore; a.YG += homeScore;
    if(homeScore > awayScore){ h.G++; a.M++; h.formList.push('w'); a.formList.push('l'); }
    else if(homeScore < awayScore){ a.G++; h.M++; a.formList.push('w'); h.formList.push('l'); }
    else { h.B++; a.B++; h.formList.push('d'); a.formList.push('d'); }
  }

  if(state.fixtures && state.fixtures.length){
    state.fixtures.forEach(week => {
      week.matches.forEach(m => {
        if(m.homeScore !== null && m.homeScore !== "" && m.awayScore !== null && m.awayScore !== ""){
          processMatch(m.homeId, m.awayId, parseInt(m.homeScore, 10), parseInt(m.awayScore, 10));
        }
      });
    });
  }

  const sorted = [...state.matches].sort((a,b)=>a.ts-b.ts);
  sorted.forEach(m => processMatch(m.homeId, m.awayId, m.homeScore, m.awayScore));

  const rows = Object.values(table).map(r=>({...r, AV:r.AG-r.YG, P:r.G*3+r.B, form:r.formList.slice(-5)}));
  rows.sort((a,b)=> b.P-a.P || b.AV-a.AV || b.AG-a.AG || a.name.localeCompare(b.name,'tr'));
  return rows;
}

/* ---------- Render Arayüz ---------- */
function render(){
  const app = document.getElementById('app');
  if(!dataReady){ app.innerHTML = '<div class="empty-note">Yükleniyor…</div>'; return; }

  const bannerHtml = banner ? `<div class="status-banner ${banner.type}">${banner.type==='saving' ? '⏳' : '⚠'} ${esc(banner.text)}</div>` : '';

  if(!state){
    app.innerHTML = `
      <div class="topbar">
        <div class="brand">
          <div class="brand-dot"></div>
          <div>
            <div class="brand-name">Turnuva</div>
            <div class="brand-sub">eFootball Turnuvası &middot; Puan Durumu</div>
          </div>
        </div>
        <div>${adminToken ? '' : `<button class="btn btn-ghost" onclick="openLogin()">Yönetici Girişi</button>`}</div>
      </div>
      ${bannerHtml}
      <div class="panel">
        <div class="empty-note">${adminToken ? 'Turnuvayı oluşturmak için aşağıdaki formu doldur.' : 'Turnuva henüz oluşturulmadı. Yönetici kurulumu tamamladığında tablo burada görünecek.'}</div>
        ${adminToken ? renderInitialSetupForm() : ''}
      </div>
      <div class="footnote">Veriler GitHub üzerinde saklanıyor &middot; herkes aynı tabloyu görür</div>
    `;
    return;
  }

  const standings = computeStandings();
  const leader = standings.length ? standings[0] : null;
  let totalPlayed = state.matches.length;
  if(state.fixtures){
    state.fixtures.forEach(w => w.matches.forEach(m => {
      if(m.homeScore !== null && m.homeScore !== "" && m.awayScore !== null && m.awayScore !== "") totalPlayed++;
    }));
  }

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>
          <div class="brand-name">${esc(state.name)}</div>
          <div class="brand-sub">eFootball Turnuvası</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn ${currentView==='standings'?'btn-cyan':'btn-ghost'}" onclick="switchView('standings')">📊 Puan Durumu</button>
        <button class="btn ${currentView==='fixtures'?'btn-cyan':'btn-ghost'}" onclick="switchView('fixtures')">🗓️ Fikstür</button>
        ${adminToken
          ? `<span class="admin-pill">● YÖNETİCİ<button class="btn-icon" style="margin-left:4px;width:auto;height:auto;padding:0;border:none;background:none;color:inherit;font-size:12px;" onclick="logoutAdmin()" title="Çıkış">✕</button></span>`
          : `<button class="btn btn-ghost" onclick="openLogin()">Giriş</button>`
        }
      </div>
    </div>

    ${bannerHtml}

    <div class="scoreboard">
      <div class="scoreboard-grid">
        <div class="sb-item">
          <div class="sb-label">Lider</div>
          <div class="sb-value accent">${leader ? esc(leader.name) : '—'}</div>
        </div>
        <div class="sb-item">
          <div class="sb-label">Puan</div>
          <div class="sb-value">${leader ? leader.P : '—'}</div>
        </div>
        <div class="sb-item">
          <div class="sb-label">Takım / Oynanan Maç</div>
          <div class="sb-value small">${state.teams.length} takım &middot; ${totalPlayed} maç</div>
        </div>
      </div>
    </div>

    ${currentView === 'standings' ? `
      <div class="panel">
        <h3 class="panel-title"><span class="bar"></span>Puan Durumu</h3>
        ${renderTable(standings)}
      </div>
    ` : `
      ${renderFixturesPanel()}
    `}

    ${adminToken ? renderAdminPanels() : ''}
    ${adminToken && state.matches.length > 0 ? renderMatchHistory() : ''}

    <div class="footnote">Veriler GitHub üzerinde saklanıyor &middot; herkes güncel sayfayı görür</div>
  `;
}

function switchView(view){
  currentView = view;
  render();
}

function renderTable(standings){
  if(standings.length === 0){
    return `<div class="empty-note">Henüz takım eklenmedi.${adminToken ? '' : ' Yönetici takımları ekledikten sonra tablo burada görünecek.'}</div>`;
  }
  const rows = standings.map((r,i)=>{
    const rank = i+1;
    const avClass = r.AV > 0 ? 'av-pos' : (r.AV < 0 ? 'av-neg' : '');
    const avText = r.AV > 0 ? '+'+r.AV : r.AV;
    const formDots = r.form.map(f=>`<span class="form-dot ${f}"></span>`).join('') || '<span style="color:var(--text-faint);font-size:11px;">-</span>';
    return `
      <tr class="${rank===1 ? 'leader' : ''}">
        <td><span class="rank ${rank<=2?'top':''}">${rank}</span></td>
        <td class="left"><div class="team-cell">${teamBadge(r,22)}<span>${esc(r.name)}</span>${rank===1 && r.O>0 ? '<span class="crown">♛</span>' : ''}</div></td>
        <td>${r.O}</td><td>${r.G}</td><td>${r.B}</td><td>${r.M}</td>
        <td>${r.AG}</td><td>${r.YG}</td>
        <td class="${avClass}">${avText}</td>
        <td class="pts">${r.P}</td>
        <td><div class="form-row">${formDots}</div></td>
      </tr>`;
  }).join('');

  return `
    <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>#</th><th class="left">Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>A</th><th>Y</th><th>AV</th><th>P</th><th>Form</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>`;
}

function renderFixturesPanel(){
  if(!state.fixtures || state.fixtures.length === 0){

        <div class="empty-note">Henüz fikstür oluşturulmadı.${adminToken ? ' Aşağıdaki yönetim panelinden <b>"12 Haftalık Fikstür Kur"</b> butonuna basabilirsin.' : ''}</div>
      </div>`;
  }

  const weeksHtml = state.fixtures.map((week, wIdx) => {
    const matchesHtml = week.matches.map((m, mIdx) => {
      const home = state.teams.find(t => t.id === m.homeId) || {name: 'Takım'};
      const away = state.teams.find(t => t.id === m.awayId) || {name: 'Takım'};
      const hasScore = m.homeScore !== null && m.homeScore !== "" && m.awayScore !== null && m.awayScore !== "";

      let centerHtml = '';
      if(adminToken){
        const hVal = m.homeScore !== null && m.homeScore !== undefined ? m.homeScore : '';
        const aVal = m.awayScore !== null && m.awayScore !== undefined ? m.awayScore : '';
        centerHtml = `
          <div class="f-score-box">
            <input type="number" min="0" class="f-input" id="f_h_${wIdx}_${mIdx}" value="${hVal}" placeholder="-">
            <span style="color:var(--text-faint);font-weight:700;">:</span>
            <input type="number" min="0" class="f-input" id="f_a_${wIdx}_${mIdx}" value="${aVal}" placeholder="-">
            <button class="btn btn-cyan btn-small" onclick="saveFixtureScore(${wIdx}, ${mIdx})" title="Skoru Kaydet">✓</button>
          </div>`;
      } else {
        centerHtml = hasScore
          ? `<div class="f-badge">${m.homeScore} - ${m.awayScore}</div>`
          : `<div class="f-badge pending">VS</div>`;
      }

      return `
        <div class="fixture-row">
          <div class="f-team home"><span>${esc(home.name)}</span>${teamBadge(home, 22)}</div>
          ${centerHtml}
          <div class="f-team away">${teamBadge(away, 22)}<span>${esc(away.name)}</span></div>
        </div>`;
    }).join('');

    return `
      <div class="week-block">
        <div class="week-header"><span>${week.week}. Hafta</span><span style="font-size:11px;color:var(--text-muted);">${week.week <= 6 ? '1. Devre' : '2. Devre (Rövanş)'}</span></div>
        ${matchesHtml}
      </div>`;
  }).join('');

  return `
    <div class="panel">
      <h3 class="panel-title"><span class="bar"></span>12 Haftalık Lig Fikstürü</h3>
      ${weeksHtml}
    </div>`;
}

/* ---------- Yönetici Girişi ---------- */
function openLogin(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'loginOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>Yönetici Girişi</h2>
      <p>Puan tablosunu ve fikstürü düzenlemek için GitHub token'ını yapıştır.</p>
      <label>GitHub Token</label>
      <input id="loginToken" type="password" placeholder="github_pat_..." onkeydown="if(event.key==='Enter')submitLogin()">
      <div class="modal-error" id="loginError"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeLogin()">Vazgeç</button>
        <button class="btn btn-cyan" id="loginBtn" onclick="submitLogin()">Giriş Yap</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('loginToken').focus(),50);
}
function closeLogin(){ const o = document.getElementById('loginOverlay'); if(o) o.remove(); }

async function submitLogin(){
  const val = document.getElementById('loginToken').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  if(!val){ err.textContent = 'Lütfen token gir.'; return; }
  btn.disabled = true; btn.textContent = 'Kontrol ediliyor…';
  try{
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {
      headers:{ Authorization:`Bearer ${val}`, Accept:'application/vnd.github+json' }
    });
    if(!res.ok){ throw new Error('Token geçersiz veya repoya erişimi yok (' + res.status + ')'); }
    adminToken = val;
    closeLogin();
    render();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Giriş Yap';
  }
}
function logoutAdmin(){ adminToken = null; render(); }

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error('Dosya okunamadı'));
    reader.readAsDataURL(file);
  });
}

async function uploadTeamLogo(file, teamId){
  const rawExt = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g,'');
  const ext = rawExt || 'png';
  const path = `logos/${teamId}.${ext}`;
  const base64 = await fileToBase64(file);
  const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
  const body = { message: 'Takım logosu yüklendi', content: base64, branch: BRANCH };

  let res = await fetch(apiUrl, {
    method:'PUT',
    headers:{ Authorization:`Bearer ${adminToken}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });

  if(res.status === 422 || res.status === 409){
    const shaRes = await fetch(`${apiUrl}?ref=${BRANCH}&_=${Date.now()}`, {
      cache:'no-store',
      headers:{ Authorization:`Bearer ${adminToken}`, Accept:'application/vnd.github+json' }
    });
    if(shaRes.ok){
      const j = await shaRes.json();
      body.sha = j.sha;
      res = await fetch(apiUrl, {
        method:'PUT',
        headers:{ Authorization:`Bearer ${adminToken}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' },
        body: JSON.stringify(body)
      });
    }
  }

  if(!res.ok){
    const errJson = await res.json().catch(()=>({}));
    throw new Error(errJson.message || ('Logo yükleme hatası ' + res.status));
  }
  return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${path}?v=${Date.now()}`;
}

async function saveFixtureScore(wIdx, mIdx){
  const hVal = document.getElementById(`f_h_${wIdx}_${mIdx}`).value;
  const aVal = document.getElementById(`f_a_${wIdx}_${mIdx}`).value;

  const prev = JSON.parse(JSON.stringify(state));
  if(hVal === '' && aVal === ''){
    state.fixtures[wIdx].matches[mIdx].homeScore = null;
    state.fixtures[wIdx].matches[mIdx].awayScore = null;
  } else {
    const hs = parseInt(hVal, 10);
    const as = parseInt(aVal, 10);
    if(isNaN(hs) || isNaN(as) || hs < 0 || as < 0){
      alert('Geçerli skor girin.');
      return;
    }
    state.fixtures[wIdx].matches[mIdx].homeScore = hs;
    state.fixtures[wIdx].matches[mIdx].awayScore = as;
  }

  const ok = await saveData();
  if(!ok) state = prev;
  render();
}

async function addTeam(){
  const input = document.getElementById('newTeamInput');
  const logoInput = document.getElementById('newTeamLogo');
  const fileInput = document.getElementById('newTeamLogoFile');
  const name = input.value.trim();
  if(!name) return;
  if(state.teams.some(t=>t.name.toLowerCase()===name.toLowerCase())){ alert('Bu takım zaten var.'); return; }

  const id = uid();
  let logo = logoInput.value.trim();
  const file = fileInput.files[0];

  if(file){
    if(file.size > 1024*1024){ alert("Logo 1MB'dan küçük olmalı."); return; }
    banner = {type:'saving', text:'Logo yükleniyor…'};
    render();
    try{
      logo = await uploadTeamLogo(file, id);
    }catch(e){
      banner = {type:'error', text:'Logo yüklenemedi: ' + e.message};
      render();
      return;
    }
  }

  const prev = JSON.parse(JSON.stringify(state));
  state.teams.push({id, name, logo});
  const ok = await saveData();
  if(!ok) state = prev;
  render();
}

async function removeTeam(id){
  const prev = JSON.parse(JSON.stringify(state));
  state.teams = state.teams.filter(t=>t.id!==id);
  const ok = await saveData();
  if(!ok) state = prev;
  render();
}

async function addMatch(){
  const homeId = document.getElementById('homeTeam').value;
  const awayId = document.getElementById('awayTeam').value;
  const homeScore = parseInt(document.getElementById('homeScore').value,10);
  const awayScore = parseInt(document.getElementById('awayScore').value,10);
  if(!homeId || !awayId){ alert('Takımları seç.'); return; }
  if(homeId === awayId){ alert('Kendisiyle oynayamaz.'); return; }

  const prev = JSON.parse(JSON.stringify(state));
  state.matches.push({id:uid(), homeId, awayId, homeScore, awayScore, ts:Date.now()});
  const ok = await saveData();
  if(!ok) state = prev;
  render();
}

async function removeMatch(id){

  state.matches = state.matches.filter(m=>m.id!==id);
